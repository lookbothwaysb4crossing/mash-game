<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --mint:#A8E6CF;--mint-dark:#2ECC89;--mint-deep:#1aab6d;
  --mint-light:#F0FFF4;--mint-bg:#E8F8F0;
  --pink:#FEC5BB;--pink-light:#FFF0ED;
  --lavender:#DDA0DD;--lav-light:#F8F0FF;
  --cream:#FFFEF7;--white:#FFFFFF;
  --text:#2D3748;--text-mid:#4A5568;--text-light:#718096;
  --shadow:0 4px 20px rgba(46,204,137,0.15);
  --shadow-lg:0 8px 32px rgba(46,204,137,0.2);
  --radius:16px;--radius-sm:10px;--radius-full:50px;
}
body{font-family:'Nunito',sans-serif;background:var(--mint-light);color:var(--text);min-height:100vh;overflow-x:hidden}
#root{max-width:430px;margin:0 auto;min-height:100vh;background:var(--mint-light);position:relative}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-pink{background:linear-gradient(135deg,#fff5f5,#fff)}
.card-lavender{background:linear-gradient(135deg,#faf5ff,#fff)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border-radius:var(--radius-full);border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;transition:all .2s;text-decoration:none}
.btn-mint{background:var(--mint-dark);color:#fff}
.btn-mint:hover{background:var(--mint-deep);transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--mint-dark);color:var(--mint-dark)}
.btn-outline:hover{background:var(--mint-light)}
.btn-pink{background:var(--pink);color:var(--text)}
.btn-ghost{background:rgba(168,230,207,0.2);color:var(--mint-deep)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn-full{width:100%}
input,textarea{width:100%;border:2px solid var(--mint);border-radius:var(--radius-sm);padding:12px;font-family:'Nunito',sans-serif;font-size:14px;color:var(--text);background:var(--white);outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:var(--mint-dark)}
.page{padding:20px 16px 90px;min-height:100vh}
.page-title{font-size:24px;font-weight:900;color:var(--text);margin-bottom:4px}
.page-sub{font-size:14px;color:var(--text-light);margin-bottom:20px}
.section-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:12px}
.tag{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.divider{height:1px;background:var(--mint);opacity:.3;margin:16px 0}
/* Header */
.header{background:var(--white);padding:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:100}
.header-logo{font-family:'Pacifico',cursive;font-size:22px;color:var(--mint-dark)}
.header-user{display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--mint-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid rgba(168,230,207,.4);display:flex;z-index:200;padding:6px 0 10px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 0;border:none;background:none;font-family:'Nunito',sans-serif;transition:all .2s}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item .nav-label{font-size:10px;font-weight:700;color:var(--text-light)}
.nav-item.active .nav-label{color:var(--mint-dark)}
/* Auth */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#e8f8f0 0%,#f8f0ff 100%)}
.auth-logo{font-family:'Pacifico',cursive;font-size:42px;color:var(--mint-dark);margin-bottom:4px}
.auth-tagline{font-size:15px;color:var(--text-light);margin-bottom:32px;text-align:center}
.auth-card{background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px;width:100%;max-width:360px}
.auth-title{font-size:20px;font-weight:900;margin-bottom:20px;color:var(--text)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text-mid);margin-bottom:6px}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--text-light)}
.auth-switch span{color:var(--mint-dark);cursor:pointer;font-weight:700}
.error-msg{background:#fff5f5;color:#e53e3e;border-radius:8px;padding:10px;font-size:13px;margin-bottom:12px}
/* Mood */
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mood-btn{padding:12px 8px;border-radius:14px;border:2px solid transparent;background:var(--mint-light);cursor:pointer;text-align:center;transition:all .2s;font-family:'Nunito',sans-serif}
.mood-btn:hover{transform:scale(1.05);border-color:var(--mint)}
.mood-btn.selected{border-color:var(--mint-dark);background:rgba(46,204,137,.1)}
.mood-emoji{font-size:28px;display:block}
.mood-label{font-size:11px;font-weight:700;color:var(--text-mid);margin-top:4px}
/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-day-name{text-align:center;font-size:11px;font-weight:700;color:var(--text-light);padding:4px}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-mid);background:transparent;position:relative}
.cal-cell.has-mood{cursor:pointer}
.cal-cell.today{background:var(--mint-light);color:var(--mint-dark);font-weight:900}
.cal-cell.empty{opacity:0}
.mood-dot{position:absolute;bottom:1px;right:1px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px}
/* Journal */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat-card{padding:16px;border-radius:14px;border:2px solid transparent;cursor:pointer;transition:all .2s;text-align:center}
.cat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cat-card.selected{border-color:var(--mint-dark)}
.cat-emoji{font-size:28px;display:block;margin-bottom:6px}
.cat-name{font-size:13px;font-weight:800;color:var(--text)}
/* Tabs */
.tabs{display:flex;background:var(--mint-light);border-radius:var(--radius-full);padding:4px;margin-bottom:20px}
.tab{flex:1;padding:10px;border-radius:var(--radius-full);border:none;background:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;color:var(--text-light);transition:all .2s}
.tab.active{background:var(--white);color:var(--mint-dark);box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* Affirmation card */
.affirmation-card{background:linear-gradient(135deg,#e8f8f0,#f0fff4);border-radius:20px;padding:28px;text-align:center;margin-bottom:20px;border:1px solid rgba(168,230,207,.3)}
.affirmation-text{font-size:18px;font-weight:700;color:var(--text);line-height:1.6;font-style:italic;margin-bottom:16px}
.quote-card{background:linear-gradient(135deg,#faf5ff,#fff);border-radius:16px;padding:24px;margin-bottom:12px;border-left:4px solid var(--lavender)}
.quote-text{font-size:16px;font-weight:600;color:var(--text);line-height:1.6;font-style:italic;margin-bottom:8px}
.quote-author{font-size:13px;color:var(--text-light);font-weight:700}
/* Playlist */
.playlist-card{border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid rgba(0,0,0,.06)}
.playlist-mood{font-size:18px;font-weight:900;margin-bottom:4px}
.playlist-desc{font-size:13px;color:var(--text-mid);margin-bottom:12px}
.song-list{list-style:none;margin-bottom:14px}
.song-list li{font-size:13px;color:var(--text-mid);padding:4px 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.song-list li:last-child{border:none}
.song-list li::before{content:"♪ ";color:var(--mint-dark)}
/* Dopamine */
.dopamine-cat{margin-bottom:20px}
.dopamine-cat-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:10px}
.activity-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--mint-light);margin-bottom:6px;cursor:pointer;transition:background .2s}
.activity-item:hover{background:rgba(168,230,207,.4)}
.activity-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--mint-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.activity-check.checked{background:var(--mint-dark)}
.activity-text{font-size:14px;color:var(--text-mid);font-weight:600}
/* Entries */
.entry-item{background:var(--white);border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.entry-date{font-size:12px;color:var(--text-light);margin-bottom:4px}
.entry-cat{font-size:12px;font-weight:700;color:var(--mint-dark);margin-bottom:6px}
.entry-preview{font-size:13px;color:var(--text-mid);line-height:1.5}
/* About */
.about-section{margin-bottom:24px}
.about-section h3{font-size:16px;font-weight:900;color:var(--text);margin-bottom:10px}
.tip-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.tip-num{width:24px;height:24px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mint-deep);flex-shrink:0}
/* Spinner */
.spinner{width:40px;height:40px;border:3px solid var(--mint);border-top-color:var(--mint-dark);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:flex;align-items:center;justify-content:center;min-height:100vh}
/* Quick cards on home */
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.quick-card{padding:16px;border-radius:14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:4px}
.quick-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.quick-icon{font-size:24px}
.quick-name{font-size:13px;font-weight:800;color:var(--text)}
.quick-desc{font-size:11px;color:var(--text-light)}
.greeting{font-family:'Pacifico',cursive;font-size:26px;color:var(--mint-dark);margin-bottom:4px}
.add-input-row{display:flex;gap:8px;margin-top:8px}
.add-input-row input{flex:1}
</style>
</head>

const JOURNAL_CATS=[

// ===== STORAGE UTILS =====
const getUsers=()=>JSON.parse(localStorage.getItem('imgood_users')||'{}');
const saveUsers=u=>localStorage.setItem('imgood_users',JSON.stringify(u));
const getSession=()=>localStorage.getItem('imgood_session');

const clearSession=()=>localStorage.removeItem('imgood_session');

  const all=JSON.parse(localStorage.getItem('imgood_data_'+u.toLowerCase())||'{}');

};

  const all=getUserData(u);
  all[key]=val;
  localStorage.setItem('imgood_data_'+u.toLowerCase(),JSON.stringify(all));
};

// ===== AUTH SCREEN =====
function AuthScreen({onLogin}){
  const [mode,setMode]=useState('signin');
  const [form,setForm]=useState({username:'',password:'',confirm:''});
  const [err,setErr]=useState('');
  const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const submit=e=>{
    e.preventDefault();setErr('');
    const u=form.username.trim();
    if(!u||!form.password){setErr('Please fill in all fields.');return;}
    if(u.length<3){setErr('Username must be at least 3 characters.');return;}
    if(!/^[a-zA-Z0-9_]+$/.test(u)){setErr('Username can only contain letters, numbers, and underscores.');return;}
    const users=getUsers();
    if(mode==='signup'){
      if(form.password.length<6){setErr('Password must be at least 6 characters.');return;}
      if(form.password!==form.confirm){setErr('Passwords do not match.');return;}
      if(users[u.toLowerCase()]){setErr('That username is already taken 💔 Try another!');return;}
      users[u.toLowerCase()]={username:u,password:form.password,createdAt:Date.now()};
      saveUsers(users);setSession(u);onLogin(u);
    } else {
      const user=users[u.toLowerCase()];
      if(!user||user.password!==form.password){setErr('Incorrect username or password 😢');return;}
      setSession(user.username);onLogin(user.username);
    }
  };
  return(
    <div className="auth-screen">
      <div className="auth-logo">im good ✨</div>

// ===== MOOD HISTORY PAGE =====
function MoodHistoryPage({username}){
  const today=new Date();
  const [viewDate,setViewDate]=useState({year:today.getFullYear(),month:today.getMonth()});
  const moods=getUserData(username,'moods',{});

  const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const firstDay=(y,m)=>new Date(y,m,1).getDay();

  const {year,month}=viewDate;
  const days=daysInMonth(year,month);
  const startDay=firstDay(year,month);
  const monthName=new Date(year,month,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});

  const prev=()=>setViewDate(v=>v.month===0?{year:v.year-1,month:11}:{...v,month:v.month-1});
  const next=()=>setViewDate(v=>v.month===11?{year:v.year+1,month:0}:{...v,month:v.month+1});

  const todayStr=toDate();
  const cells=[];
  for(let i=0;i<startDay;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);

  return(
    <div className="page">
      <p className="page-title">mood history 📅</p>
      <p className="page-sub">track your healing journey</p>

      <div className="card" style={{marginBottom:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <button className="btn btn-ghost btn-sm" onClick={prev}>← prev</button>
          <span style={{fontWeight:800,fontSize:15}}>{monthName}</span>
          <button className="btn btn-ghost btn-sm" onClick={next}>next →</button>
        </div>
        <div className="cal-header">
          {['S','M','T','W','T','F','S'].map((d,i)=><div key={i} className="cal-day-name">{d}</div>)}
        </div>
        <div className="cal-grid">
          {cells.map((day,i)=>{
            if(!day) return <div key={i} className="cal-cell empty"/>;
            const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const moodId=moods[dateStr];
            const moodData=moodId?MOOD_OPTIONS.find(m=>m.id===moodId):null;
            const isToday=dateStr===todayStr;
            return(
              <div key={i} className={`cal-cell${moodData?' has-mood':''}${isToday?' today':''}`}>
                {day}
                {moodData&&(
                  <div className="mood-dot" style={{background:moodData.color}} title={moodData.label}>
                    {moodData.emoji}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Legend */}
      <div className="card">
        <p className="section-title">mood legend</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
          {MOOD_OPTIONS.map(m=>(
            <div key={m.id} style={{display:'flex',alignItems:'center',gap:4,background:m.color+'33',borderRadius:20,padding:'4px 10px'}}>
              <span style={{fontSize:16}}>{m.emoji}</span>
              <span style={{fontSize:12,fontWeight:700,color:'var(--text-mid)'}}>{m.label}</span>
            </div>
          ))}
        </div>
        <div className="divider"/>
        <p style={{fontSize:13,color:'var(--text-light)',textAlign:'center'}}>
          {Object.keys(moods).length} mood{Object.keys(moods).length!==1?'s':''} tracked total 💚
        </p>
      </div>
    </div>
  );
}

function JournalPage({username}){
  const [view,setView]=useState('cats'); // cats | write | entries
  const [selCat,setSelCat]=useState(null);
  const [promptIdx,setPromptIdx]=useState(0);
  const [text,setText]=useState('');
  const [saved,setSaved]=useState(false);
  const entries=getUserData(username,'journal',[]);

  const openCat=cat=>{setSelCat(cat);setPromptIdx(0);setText('');setSaved(false);setView('write');};

  const save=()=>{
    if(!text.trim()) return;
    const entry={id:Date.now(),cat:selCat.id,catName:selCat.name,catEmoji:selCat.emoji,prompt:selCat.prompts[promptIdx],text:text.trim(),date:new Date().toISOString()};
    const updated=[entry,...entries];
    setUserData(username,'journal',updated);
    setSaved(true);
  };

  const nextPrompt=()=>{
    setPromptIdx(i=>(i+1)%selCat.prompts.length);
    setSaved(false);
  };

  if(view==='entries'){
    const allEntries=getUserData(username,'journal',[]);
    return(
      <div className="page">
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>

            <p style={{fontSize:15,fontWeight:700,color:'var(--text-mid)'}}>no entries yet</p>
            <p style={{fontSize:13,color:'var(--text-light)',marginTop:4}}>start writing to see your journey unfold</p>

          <button className="btn btn-ghost btn-sm" onClick={()=>setView('cats')}>← back</button>
          <span style={{fontSize:22}}>{selCat.emoji}</span>
          <p className="page-title" style={{fontSize:18}}>{selCat.name}</p>
        </div>
        <div className="card" style={{marginBottom:16}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:12}}>
            <p style={{fontSize:15,fontWeight:700,color:'var(--text)',lineHeight:1.5,flex:1}}>💭 {selCat.prompts[promptIdx]}</p>

        {saved?
          <div style={{background:'var(--mint-light)',borderRadius:10,padding:12,textAlign:'center',fontSize:14,fontWeight:700,color:'var(--mint-deep)'}}>

          save entry 💚

  return(

// ===== DOPAMINE MENU PAGE =====
function DopamineMenuPage({username}){
  const canvasRef=useRef(null);
  const initMenu=()=>{
    const m={};
    Object.entries(DOPAMINE_DEFAULTS).forEach(([cat,items])=>{
      m[cat]=items.map(text=>({text,checked:false,custom:false}));
    });
    return m;
  };
  const [menu,setMenu]=useState(()=>{
    const saved=getUserData(username,'dopamineMenu',null);
    if(saved) return saved;
    const m=initMenu();
    setUserData(username,'dopamineMenu',m);
    return m;
  });
  const [addText,setAddText]=useState({});

  const toggle=(cat,idx)=>{
    const updated={...menu,[cat]:menu[cat].map((item,i)=>i===idx?{...item,checked:!item.checked}:item)};
    setMenu(updated);setUserData(username,'dopamineMenu',updated);
  };
  const deleteItem=(cat,idx)=>{
    const updated={...menu,[cat]:menu[cat].filter((_,i)=>i!==idx)};
    setMenu(updated);setUserData(username,'dopamineMenu',updated);
  };
  const addItem=cat=>{
    const t=(addText[cat]||'').trim();
    if(!t) return;
    const updated={...menu,[cat]:[...menu[cat],{text:t,checked:false,custom:true}]};
    setMenu(updated);setUserData(username,'dopamineMenu',updated);
    setAddText(a=>({...a,[cat]:''}));
  };

  const downloadCanvas=()=>{
    const canvas=document.createElement('canvas');
    canvas.width=800;canvas.height=1100;
    const ctx=canvas.getContext('2d');
    // Background gradient
    const grad=ctx.createLinearGradient(0,0,800,1100);
    grad.addColorStop(0,'#E8F8F0');grad.addColorStop(1,'#F8F0FF');
    ctx.fillStyle=grad;ctx.fillRect(0,0,800,1100);

    // Decorative top bar
    ctx.fillStyle='#2ECC89';ctx.fillRect(0,0,800,8);

    // Title
    ctx.fillStyle='#2ECC89';ctx.font='bold 36px Georgia, serif';
    ctx.textAlign='center';ctx.fillText('my dopamine menu ⚡',400,60);

    // Username & date
    ctx.fillStyle='#718096';ctx.font='18px Arial';
    ctx.fillText('@'+username+' · '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}),400,90);

    ctx.fillStyle='#A8E6CF';ctx.fillRect(50,108,700,2);

    let y=140;
    const checkedAll=[];
    Object.entries(menu).forEach(([cat,items])=>{
      const checked=items.filter(i=>i.checked);
      if(checked.length>0) checkedAll.push({cat,items:checked});
    });

    if(checkedAll.length===0){
      // Show all items if none checked
      Object.entries(menu).forEach(([cat,items])=>{
        checkedAll.push({cat,items});
      });
    }

    checkedAll.forEach(({cat,items})=>{
      if(y>1020) return;
      ctx.fillStyle='#2ECC89';ctx.font='bold 20px Arial';
      ctx.textAlign='left';ctx.fillText(cat,60,y);y+=32;
      items.slice(0,6).forEach(item=>{
        if(y>1040) return;
        ctx.fillStyle='#4A5568';ctx.font='16px Arial';
        ctx.fillText('✓  '+item.text,80,y);y+=26;
      });
      y+=14;
    });

    // Footer
    ctx.fillStyle='#A8E6CF';ctx.fillRect(50,1060,700,2);
    ctx.fillStyle='#2ECC89';ctx.font='bold 18px Georgia';
    ctx.textAlign='center';ctx.fillText('im good ✨  — your healing era starts now',400,1090);

    const link=document.createElement('a');
    link.download='my-dopamine-menu.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  };

  const checkedCount=Object.values(menu).flat().filter(i=>i.checked).length;

  return(
    <div className="page">
      <p className="page-title">dopamine menu ⚡</p>
      <p className="page-sub">build your personalized feel-good toolkit</p>
      <div className="card" style={{marginBottom:16,background:'linear-gradient(135deg,#e8f8f0,#f0fff4)',border:'1px solid rgba(168,230,207,.3)'}}>
        <p style={{fontSize:14,color:'var(--text-mid)',lineHeight:1.6,marginBottom:12}}>
          ✅ check off what feels good today · ✏️ add your own · 💾 download your menu
        </p>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn btn-mint" onClick={downloadCanvas}>
            💾 download my menu
          </button>
          {checkedCount>0&&<span style={{fontSize:13,color:'var(--mint-deep)',fontWeight:700}}>
            {checkedCount} item{checkedCount!==1?'s':''} selected ✨
          </span>}
        </div>
      </div>

      {Object.entries(menu).map(([cat,items])=>(
        <div key={cat} className="dopamine-cat">
          <p className="dopamine-cat-title">{cat}</p>
          {items.map((item,idx)=>(
            <div key={idx} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <div className={`activity-item${item.checked?' ':' '}`}
                style={{flex:1,background:item.checked?'rgba(46,204,137,.15)':'var(--mint-light)',border:item.checked?'1.5px solid var(--mint-dark)':'1.5px solid transparent'}}
                onClick={()=>toggle(cat,idx)}>
                <div className={`activity-check${item.checked?' checked':''}`}>
                  {item.checked&&<span style={{color:'#fff',fontSize:12}}>✓</span>}
                </div>
                <span className="activity-text" style={{textDecoration:item.checked?'line-through':'none',color:item.checked?'var(--mint-dark)':'var(--text-mid)'}}>{item.text}</span>
              </div>
              {item.custom&&<button onClick={()=>deleteItem(cat,idx)} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:'#ccc',padding:'4px'}}>✕</button>}
            </div>
          ))}
          <div className="add-input-row">
            <input value={addText[cat]||''} onChange={e=>setAddText(a=>({...a,[cat]:e.target.value}))}
              onKeyDown={e=>e.key==='Enter'&&addItem(cat)}
              placeholder="add your own activity..."
              style={{fontSize:13,padding:'8px 12px'}}/>
            <button className="btn btn-mint btn-sm" onClick={()=>addItem(cat)}>add</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ===== MAIN APP =====
function App(){
  const [user,setUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const [page,setPage]=useState('home');

  useEffect(()=>{
    const session=getSession();
    if(session){
      const users=getUsers();
      if(users[session.toLowerCase()]) setUser(users[session.toLowerCase()].username||session);
    }
    setLoading(false);
  },[]);

  const handleLogin=u=>{setUser(u);setPage('home');};
  const handleLogout=()=>{clearSession();setUser(null);setPage('home');};

  if(loading) return <div className="center"><div className="spinner"/></div>;
  if(!user) return <AuthScreen onLogin={handleLogin}/>;

  const pages={
    home:<HomePage username={user} onNav={setPage}/>,
    history:<MoodHistoryPage username={user}/>,
    journal:<JournalPage username={user}/>,
    affirmations:<AffirmationsPage/>,
    playlists:<PlaylistsPage/>,
    dopamine:<DopamineMenuPage username={user}/>,
    about:<AboutPage/>
  };

  return(
    <div>
      <Header username={user} onLogout={handleLogout} onNav={setPage}/>
      <div style={{flex:1}}>
        {pages[page]||pages.home}
      </div>
      <BottomNav page={page} onNav={setPage}/>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
