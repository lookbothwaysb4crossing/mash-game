<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>im good ✨</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --mint:#A8E6CF;--mint-dark:#2ECC89;--mint-deep:#1aab6d;
  --mint-light:#F0FFF4;--mint-bg:#E8F8F0;
  --pink:#FEC5BB;--lavender:#DDA0DD;
  --white:#fff;--cream:#fffef7;
  --text:#2D3748;--text-mid:#4A5568;--text-light:#718096;
  --shadow:0 4px 20px rgba(46,204,137,.15);
  --shadow-lg:0 8px 32px rgba(46,204,137,.2);
  --r:16px;--rf:50px;
}
body{font-family:"Nunito",sans-serif;background:var(--mint-light);color:var(--text);min-height:100vh}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--mint-light);position:relative}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border-radius:var(--rf);border:none;cursor:pointer;font-family:"Nunito",sans-serif;font-weight:700;font-size:14px;transition:all .2s;text-decoration:none}
.btn-mint{background:var(--mint-dark);color:#fff}.btn-mint:hover{background:var(--mint-deep)}
.btn-outline{background:transparent;border:2px solid var(--mint-dark);color:var(--mint-dark)}
.btn-ghost{background:rgba(168,230,207,.25);color:var(--mint-deep)}
.btn-sm{padding:8px 16px;font-size:13px}.btn-full{width:100%}
input,textarea{width:100%;border:2px solid var(--mint);border-radius:10px;padding:12px;font-family:"Nunito",sans-serif;font-size:14px;color:var(--text);background:var(--white);outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:var(--mint-dark)}
.page{padding:20px 16px 90px;min-height:100vh}
.page-title{font-size:24px;font-weight:900;margin-bottom:4px}
.page-sub{font-size:14px;color:var(--text-light);margin-bottom:20px}
.sec-title{font-size:16px;font-weight:800;margin-bottom:12px}
/* Header */
.header{background:var(--white);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:100}
.logo{font-family:"Pacifico",cursive;font-size:22px;color:var(--mint-dark);cursor:pointer}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--mint-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px}
.header-right{display:flex;align-items:center;gap:8px}
/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid rgba(168,230,207,.4);display:flex;z-index:200;padding:6px 0 10px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 0;border:none;background:none;font-family:"Nunito",sans-serif;transition:all .2s}
.nav-icon{font-size:19px;line-height:1}
.nav-label{font-size:10px;font-weight:700;color:var(--text-light)}
.nav-item.active .nav-label{color:var(--mint-dark)}
/* Auth */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#e8f8f0,#f8f0ff)}
.auth-logo{font-family:"Pacifico",cursive;font-size:42px;color:var(--mint-dark);margin-bottom:4px}
.auth-tagline{font-size:15px;color:var(--text-light);margin-bottom:32px;text-align:center}
.auth-card{background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px;width:100%;max-width:360px}
.auth-title{font-size:20px;font-weight:900;margin-bottom:20px}
.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:700;color:var(--text-mid);margin-bottom:6px}
.err{background:#fff5f5;color:#e53e3e;border-radius:8px;padding:10px;font-size:13px;margin-bottom:12px}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--text-light)}
.auth-switch span{color:var(--mint-dark);cursor:pointer;font-weight:700}
/* Home */
.greeting{font-family:"Pacifico",cursive;font-size:26px;color:var(--mint-dark);margin-bottom:4px}
.aff-card{background:linear-gradient(135deg,#e8f8f0,#f0fff4);border-radius:20px;padding:24px;margin-bottom:20px;border:1px solid rgba(168,230,207,.3)}
.aff-text{font-size:17px;font-weight:700;color:var(--text);line-height:1.6;font-style:italic;margin-bottom:14px}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.mood-btn{padding:12px 6px;border-radius:14px;border:2px solid transparent;background:var(--mint-light);cursor:pointer;text-align:center;transition:all .2s;font-family:"Nunito",sans-serif}
.mood-btn:hover{border-color:var(--mint);transform:scale(1.04)}
.mood-btn.sel{border-color:var(--mint-dark);background:rgba(46,204,137,.1)}
.mood-emoji{font-size:26px;display:block}.mood-label{font-size:11px;font-weight:700;color:var(--text-mid);margin-top:3px}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.quick-card{padding:16px;border-radius:14px;cursor:pointer;transition:all .2s}
.quick-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.quick-icon{font-size:24px}.quick-name{font-size:13px;font-weight:800;margin-top:4px}.quick-desc{font-size:11px;color:var(--text-light);margin-top:2px}
/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dname{text-align:center;font-size:11px;font-weight:700;color:var(--text-light);padding:4px}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-mid);position:relative;flex-direction:column;gap:1px}
.cal-cell.today{background:var(--mint-light);color:var(--mint-dark);font-weight:900}
.mdot{font-size:11px;line-height:1}
/* Tabs */
.tabs{display:flex;background:var(--mint-light);border-radius:var(--rf);padding:4px;margin-bottom:20px}
.tab{flex:1;padding:10px;border-radius:var(--rf);border:none;background:none;font-family:"Nunito",sans-serif;font-size:14px;font-weight:700;cursor:pointer;color:var(--text-light);transition:all .2s}
.tab.active{background:var(--white);color:var(--mint-dark);box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* Journal */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat-card{padding:16px;border-radius:14px;cursor:pointer;transition:all .2s;text-align:center;border:2px solid transparent}
.cat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cat-emoji{font-size:28px;display:block;margin-bottom:6px}.cat-name{font-size:13px;font-weight:800}
/* Affirmations */
.big-card{background:linear-gradient(135deg,#e8f8f0,#f0fff4);border-radius:20px;padding:28px;text-align:center;margin-bottom:16px;border:1px solid rgba(168,230,207,.3);min-height:160px;display:flex;flex-direction:column;justify-content:center}
.big-text{font-size:17px;font-weight:700;color:var(--text);line-height:1.7;font-style:italic;margin-bottom:14px}
.quote-card{background:linear-gradient(135deg,#faf5ff,#fff);border-radius:16px;padding:20px;margin-bottom:12px;border-left:4px solid var(--lavender)}
.quote-text{font-size:15px;font-weight:600;color:var(--text);line-height:1.6;font-style:italic;margin-bottom:8px}
.quote-author{font-size:13px;color:var(--text-light);font-weight:700}
/* Playlist */
.pl-card{border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid rgba(0,0,0,.06)}
.pl-mood{font-size:18px;font-weight:900;margin-bottom:4px}.pl-desc{font-size:13px;color:var(--text-mid);margin-bottom:12px}
.song-list{list-style:none;margin-bottom:14px}
.song-list li{font-size:13px;color:var(--text-mid);padding:4px 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.song-list li:last-child{border:none}.song-list li::before{content:"♪ ";color:var(--mint-dark)}
/* Dopamine */
.dop-cat{margin-bottom:20px}
.dop-cat-title{font-size:15px;font-weight:800;margin-bottom:10px}
.act-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--mint-light);margin-bottom:6px;cursor:pointer;transition:background .2s;border:1.5px solid transparent}
.act-item.checked{background:rgba(46,204,137,.12);border-color:var(--mint-dark)}
.act-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--mint-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:11px;color:#fff}
.act-check.on{background:var(--mint-dark)}
.act-text{font-size:14px;font-weight:600;color:var(--text-mid);flex:1}
.act-text.done{text-decoration:line-through;color:var(--mint-dark)}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;padding:8px 12px;font-size:13px}
/* Entries */
.entry-item{background:var(--white);border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.entry-meta{display:flex;justify-content:space-between;margin-bottom:4px}
.entry-cat{font-size:12px;font-weight:700;color:var(--mint-dark)}
.entry-date{font-size:12px;color:var(--text-light)}
.entry-prompt{font-size:12px;color:var(--text-light);font-style:italic;margin-bottom:6px}
.entry-text{font-size:13px;color:var(--text-mid);line-height:1.6}
/* About */
.tip-item{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.tip-num{width:24px;height:24px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mint-deep);flex-shrink:0;margin-top:1px}
.remember-item{font-size:14px;color:var(--text);line-height:1.7;margin-bottom:10px;padding-left:12px;border-left:3px solid var(--mint-dark);font-weight:600}
.divider{height:1px;background:var(--mint);opacity:.3;margin:16px 0}
.badge{background:var(--mint-light);color:var(--mint-deep);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block}
.info-box{background:rgba(168,230,207,.2);border-radius:12px;padding:14px;font-size:13px;color:var(--text-mid);line-height:1.7}
</style>
</head>

<script>

var DAILY_AFFS=["I am healing at my own pace, and that's perfectly okay.","My worth is not defined by who stayed or who left.","I deserve love that doesn't require me to shrink myself.","Every ending is a new beginning in disguise.","I am becoming the person I needed when I was hurting.","My heart is resilient and capable of loving again.","I choose myself every single day.","I am not what happened to me — I am what I choose to become.","Healing is not linear and I am patient with myself.","I release what no longer serves my highest good.","I am magnetic, powerful, and worthy of great love.","My energy is my currency — I spend it wisely.","I trust the timing of my life.","I am whole, complete, and enough exactly as I am.","The love I give to others, I now give to myself.","I am not waiting to be chosen — I am the prize.","My future is bright and full of people who truly see me.","I outgrow people and situations — that's growth, not loss.","I am building a life I'm genuinely excited about.","Peace is my priority. Drama has no place in my story."];

var QUOTES=[{t:"She remembered who she was and the game changed.",a:"Lalah Delia"},{t:"You didn't lose him. You lost the version of yourself that accepted less than you deserve.",a:"Unknown"},{t:"Not every chapter needs a happy ending. Some chapters just need to end.",a:"Unknown"},{t:"Your new life is going to cost you your old one.",a:"Unknown"},{t:"The most powerful thing you can do after a breakup is focus on yourself so hard that you forget he exists.",a:"Unknown"},{t:"Healing doesn't mean the damage never existed. It means the damage no longer controls your life.",a:"Akshay Dubey"},{t:"Some things break your heart but fix your vision.",a:"Unknown"},{t:"The right one won't make you question your worth.",a:"Unknown"},{t:"Fall in love with taking care of yourself.",a:"Unknown"},{t:"You owe yourself the love that you freely give to others.",a:"Unknown"},{t:"She was never crazy. She was passionate about things that didn't deserve her passion.",a:"R.H. Sin"},{t:"The most important relationship is the one you have with yourself.",a:"Diane Von Furstenberg"},{t:"You yourself, as much as anybody in the entire universe, deserve your love and affection.",a:"Buddha"},{t:"Cry a river, build a bridge, and get over it.",a:"Unknown"},{t:"Plot twist: the person you needed to find yourself again was you.",a:"Unknown"}];
var JCATS=[{id:"healing",name:"Healing Journey",emoji:"🌱",color:"#E8F8F0",prompts:["What does healing feel like in my body right now?","What am I learning about myself through this pain?","Three things I've done recently that were just for me:","What would I tell my heartbroken self from 6 months ago?","How have I grown since this relationship ended?","What patterns am I ready to break?"]},{id:"selflove",name:"Self-Love",emoji:"💕",color:"#FFF0F5",prompts:["What do I love most about myself today?","List 10 things your body does amazingly for you:","How can I be gentler with myself this week?","What compliment do I need to hear right now? Write it yourself!","What makes me uniquely, wonderfully me?","If my best friend described me, what would she say?"]},{id:"gratitude",name:"Gratitude",emoji:"✨",color:"#FFFBEA",prompts:["What am I grateful for that this relationship taught me?","Name 5 people who love and support me:","What small moments of joy have I noticed recently?","What freedoms do I have now that I appreciate?","What beautiful things happened today, even if small?","What is something about my life right now that future-me will be grateful for?"]},{id:"release",name:"Release & Vent",emoji:"🔥",color:"#FFF3F0",prompts:["Write a letter you'll never send. Say everything.","What feelings have I been avoiding that need attention?","What am I still angry about? Give yourself permission to feel it.","What did I put up with that I should have walked away from sooner?","What do I need to stop carrying that isn't mine to hold?","What conversations do I wish I had?"]},{id:"future",name:"Future Dreams",emoji:"🌟",color:"#F5F0FF",prompts:["Describe your dream life in 2 years:","What kind of partner do I truly deserve? Be specific.","What adventures am I going to have as a single person?","What goals am I going to crush now that I have more energy?","What does my glow-up look like?","Write a letter from your future thriving self:"]},{id:"discovery",name:"Self-Discovery",emoji:"🔍",color:"#F0F8FF",prompts:["What did I compromise about myself in this relationship?","What are my non-negotiables in any relationship going forward?","What parts of myself am I rediscovering?","What did I stop doing that made me happy? How can I start again?","Who am I outside of that relationship?","What do I actually need vs what I thought I needed?"]},{id:"lessons",name:"Lessons Learned",emoji:"📚",color:"#F0FFF8",prompts:["What red flags did I ignore? What will I look for next time?","What did this relationship show me about my patterns?","What would I do differently? No shame, just growth!","What did I learn about what I need to feel loved?","How did this relationship help me grow?","What boundaries am I setting from now on?"]},{id:"growth",name:"Growth & Goals",emoji:"🌈",color:"#FFF0FA",prompts:["What habits am I building that future me will thank me for?","One thing I'm going to do this week to invest in myself:","What skills or hobbies am I going to develop?","How am I going to show up differently for myself?","What does my ideal morning routine look like?","What does the best version of me look like in 6 months?"]}];
var PLAYLISTS=[{mood:"😭 Cry It Out",desc:"For when you need to ugly cry and feel everything",color:"#EEF2FF",btn:"#6C83D8",url:"https://open.spotify.com/playlist/37i9dQZF1DX3YSRoSdA634",songs:["drivers license — Olivia Rodrigo","Someone Like You — Adele","White Flag — Joseph","The Night Will Always Win — James Bay"]},{mood:"😤 Mad Era",desc:"Channel that rage into pure power, bestie",color:"#FFF0F0",btn:"#E05555",url:"https://open.spotify.com/playlist/37i9dQZF1DWU4lunDP0X0F",songs:["good 4 u — Olivia Rodrigo","IDGAF — Dua Lipa","You Oughta Know — Alanis Morissette","Forget You — CeeLo Green"]},{mood:"🌱 Healing Slowly",desc:"Gentle, hopeful sounds for the in-between days",color:"#F0FFF4",btn:"#2ECC89",url:"https://open.spotify.com/playlist/37i9dQZF1DWZqd5JICZI0u",songs:["Bloom — The Paper Kites","Better Place — Rachel Platten","Rise Up — Andra Day","Dog Days Are Over — Florence + Machine"]},{mood:"✨ Glow Up Season",desc:"You're back and you're THAT girl, no debate",color:"#FFFBEA",btn:"#E6AC00",url:"https://open.spotify.com/playlist/37i9dQZF1DX4JAvHpjipBk",songs:["Flowers — Miley Cyrus","Break My Soul — Beyoncé","Thank U, Next — Ariana Grande","Confident — Demi Lovato"]},{mood:"🌙 2AM Thoughts",desc:"For the late night spiral, we don't judge",color:"#F5F0FF",btn:"#9B7FD4",url:"https://open.spotify.com/playlist/37i9dQZF1DXcCnTAt8CfNe",songs:["Exile — Taylor Swift ft. Bon Iver","Liability — Lorde","Skinny Love — Bon Iver","Ghost — Indila"]}];

var MOODS=[{id:"rockbottom",e:"💀",label:"rock bottom",color:"#8B9DC3"},{id:"devastated",e:"😭",label:"devastated",color:"#9B89B6"},{id:"sad",e:"😔",label:"sad",color:"#87CEEB"},{id:"meh",e:"😐",label:"meh",color:"#F0E68C"},{id:"okay",e:"🙂",label:"okay",color:"#90EE90"},{id:"thriving",e:"✨",label:"thriving",color:"#FFD700"}];

var state={page:'home',user:null,affIdx:0,quoteIdx:0,jView:'cats',jCat:null,jPromptIdx:0,jText:'',affTab:'affirmations',calYear:new Date().getFullYear(),calMonth:new Date().getMonth(),dopMenu:null,expandedEntry:null};

// ===== STORAGE =====
function getUsers(){return JSON.parse(localStorage.getItem('ig_users')||'{}')}
function saveUsers(u){localStorage.setItem('ig_users',JSON.stringify(u))}
function getSession(){return localStorage.getItem('ig_session')}
function setSession(u){localStorage.setItem('ig_session',u)}
function clearSession(){localStorage.removeItem('ig_session')}
function ud(key,def){var d=JSON.parse(localStorage.getItem('ig_d_'+state.user.toLowerCase())||'{}');return key?(d[key]!==undefined?d[key]:def):d}

function today(){return new Date().toISOString().split('T')[0]}

// ===== RENDER ENGINE =====
function render(){
  var app=document.getElementById('app');
  if(!state.user){app.innerHTML=authHTML();bindAuth();return;}
  app.innerHTML='<div class="header"><div class="logo" onclick="nav(\'home\')">im good ✨</div><div class="header-right"><div class="avatar">'+state.user.charAt(0).toUpperCase()+'</div><button class="btn btn-ghost btn-sm" onclick="logout()">logout</button></div></div><div id="page-content">'+pageHTML()+'</div>'+navHTML();

}
function nav(p){state.page=p;state.jView='cats';state.jCat=null;state.jText='';render();window.scrollTo(0,0)}
function logout(){clearSession();state.user=null;render()}

// ===== NAV HTML =====
function navHTML(){
  var items=[['home','🏠','home'],['history','📅','history'],['journal','📓','journal'],['affirmations','💬','affirm'],['playlists','🎵','music'],['dopamine','⚡','dopamine'],['about','🌸','about']];

// ===== AUTH =====
function authHTML(){
  return '<div class="auth-screen"><div class="auth-logo">im good ✨</div><p class="auth-tagline">your breakup recovery bestie<br>for the girls in their healing era 🌿</p><div class="auth-card"><h2 class="auth-title" id="auth-title">welcome back 💚</h2><div id="auth-err"></div><div class="field"><label>username</label><input id="au" placeholder="your unique username" autocapitalize="none"></div><div class="field"><label>password</label><input id="ap" type="password" placeholder="your password"></div><div id="confirm-field" style="display:none" class="field"><label>confirm password</label><input id="ac" type="password" placeholder="type it again"></div><button class="btn btn-mint btn-full" id="auth-btn" onclick="doAuth()">sign in 💚</button><div class="auth-switch" id="auth-switch">don\'t have an account? <span onclick="toggleAuth()">sign up</span></div></div></div>';
}
var authMode='signin';
function toggleAuth(){
  authMode=authMode==='signin'?'signup':'signin';
  document.getElementById('auth-title').textContent=authMode==='signin'?'welcome back 💚':'join the healing ✨';
  document.getElementById('auth-btn').textContent=authMode==='signin'?'sign in 💚':'create account ✨';
  document.getElementById('confirm-field').style.display=authMode==='signup'?'block':'none';
  document.getElementById('auth-switch').innerHTML=authMode==='signin'?'don\'t have an account? <span onclick="toggleAuth()">sign up</span>':'already have an account? <span onclick="toggleAuth()">sign in</span>';

function doAuth(){
  var u=(document.getElementById('au').value||'').trim();
  var p=document.getElementById('ap').value||'';
  var c=document.getElementById('ac')?document.getElementById('ac').value||'':'';
  var err='';
  if(!u||!p){err='Please fill in all fields.'}
  else if(u.length<3){err='Username must be at least 3 characters.'}
  else if(!/^[a-zA-Z0-9_]+$/.test(u)){err='Username: letters, numbers, underscores only.'}
  else{
    var users=getUsers();
    if(authMode==='signup'){
      if(p.length<6)err='Password must be at least 6 characters.';
      else if(p!==c)err='Passwords do not match.';
      else if(users[u.toLowerCase()])err='That username is already taken 💔 Try another!';
      else{users[u.toLowerCase()]={username:u,password:p};saveUsers(users);setSession(u);state.user=u;render();return;}
    } else {
      var usr=users[u.toLowerCase()];
      if(!usr||usr.password!==p)err='Incorrect username or password 😢';
      else{setSession(usr.username);state.user=usr.username;render();return;}
    }
  }
  document.getElementById('auth-err').innerHTML='<div class="err">'+err+'</div>';
}

function downloadDop(){

  var canvas=document.createElement('canvas');

  var gr=ctx.createLinearGradient(0,0,800,1120);
  gr.addColorStop(0,'#E8F8F0');gr.addColorStop(1,'#F8F0FF');
  ctx.fillStyle=gr;ctx.fillRect(0,0,800,1120);
  ctx.fillStyle='#2ECC89';ctx.fillRect(0,0,800,8);
  ctx.fillStyle='#2ECC89';ctx.font='bold 34px Georgia,serif';ctx.textAlign='center';

  ctx.fillStyle='#A8E6CF';ctx.fillRect(50,106,700,2);
  var y=136;
  var checkedCats=[];
  Object.entries(menu).forEach(function(e){
    var items=e[1].filter(function(i){return i.checked});
    if(items.length>0)checkedCats.push({cat:e[0],items:items});
  });
  if(checkedCats.length===0){Object.entries(menu).forEach(function(e){checkedCats.push({cat:e[0],items:e[1].slice(0,4)})})}
  checkedCats.forEach(function(g){
    if(y>1040)return;
    ctx.fillStyle='#2ECC89';ctx.font='bold 19px Arial';ctx.textAlign='left';
    ctx.fillText(g.cat,60,y);y+=30;
    g.items.slice(0,5).forEach(function(item){

      ctx.fillStyle='#4A5568';ctx.font='16px Arial';
      ctx.fillText('\u2713  '+item.text,80,y);y+=26;

  });

  var a=document.createElement('a');a.download='my-dopamine-menu.png';a.href=canvas.toDataURL('image/png');a.click();
}
